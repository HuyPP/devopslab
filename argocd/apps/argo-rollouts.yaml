# =============================================================================
# argo-rollouts.yaml — Cài Argo Rollouts controller
#
# Argo Rollouts thay thế Deployment bằng Rollout CRD, hỗ trợ:
#   - Canary deploy: thả traffic dần (10% → 50% → 100%)
#   - Blue-Green deploy
#   - AnalysisTemplate: tự chấm metric, tự abort nếu tệ
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: "2.37.7"
    helm:
      values: |
        # Cài kubectl plugin dashboard (UI xem canary progress)
        dashboard:
          enabled: true
          service:
            type: NodePort
            nodePort: 30100
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
