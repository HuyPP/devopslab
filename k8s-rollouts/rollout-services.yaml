# =============================================================================
# rollout-services.yaml — 2 Service cho canary traffic splitting
#
# Argo Rollouts cần 2 Service để chia traffic:
#   canaryService  → nhận X% traffic (bản mới đang test)
#   stableService  → nhận (100-X)% traffic (bản cũ đang stable)
#
# Rollout controller tự cập nhật selector của 2 service này
# ở mỗi bước setWeight — bạn không cần sửa tay.
#
# Trong thực tế dùng với Ingress hoặc Service Mesh (Istio/Linkerd)
# để traffic splitting chính xác hơn ở layer L7.
# Ở đây dùng pod-count-based splitting (mặc định của Rollouts).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
